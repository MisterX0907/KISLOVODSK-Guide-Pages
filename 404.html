<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Открываем гид…</title></head><body><script>
const parts = location.pathname.split('/').filter(Boolean);
const base = '/' + (parts[0] || '') + '/';
const route = location.pathname.slice(base.length - 1) + location.search + location.hash;
location.replace(base + '?__route=' + encodeURIComponent(route));
</script></body></html>
